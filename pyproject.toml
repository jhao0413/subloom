[project]
name = "subloom"
version = "0.1.0"
description = "Download, transcribe, translate, and subtitle videos, with a reusable pipeline."
requires-python = ">=3.11"
dependencies = ["httpx[socks]>=0.27,<1"]

[project.optional-dependencies]
local = ["faster-whisper>=1.1,<2"]
dev = ["pytest>=8,<10", "ruff>=0.9", "pygments>=2.18,<3"]
native-build = ["cmake>=3.28,<5", "ninja>=1.11,<2"]

[project.scripts]
subloom = "subloom.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
